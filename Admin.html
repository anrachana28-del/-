<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
    font-family:Arial;
    background:#f1f5f9;
    padding:20px;
}

.card{
    background:white;
    max-width:500px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

h2{
    text-align:center;
}

#msg{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<h2>👑 ADMIN PANEL</h2>

<h3>Register User</h3>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<select id="role">
    <option value="User">User</option>
    <option value="Admin">Admin</option>
</select>

<button onclick="registerUser()">
➕ Register User
</button>

<div id="msg"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuKVB0z6NVtepmjE33qXxrxs8RcmCOwd0",
  authDomain: "create-db14a.firebaseapp.com",
  databaseURL: "https://create-db14a-default-rtdb.firebaseio.com",
  projectId: "create-db14a",
  storageBucket: "create-db14a.firebasestorage.app",
  messagingSenderId: "396455645819",
  appId: "1:396455645819:web:ca6b805ec4dab1148a88de",
  measurementId: "G-F7CWSBPKPE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.registerUser = async()=>{

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const role =
document.getElementById("role").value;

if(!username || !password){
    alert("Please fill all fields");
    return;
}

const q = query(
collection(db,"users"),
where("username","==",username)
);

const check = await getDocs(q);

if(!check.empty){

document.getElementById("msg").innerHTML =
"❌ Username already exists";

return;

}

await addDoc(
collection(db,"users"),
{
    username,
    password,
    role,
    createdAt:new Date()
}
);

document.getElementById("msg").innerHTML =
"✅ User Created Successfully";

document.getElementById("username").value="";
document.getElementById("password").value="";

};

</script>

</body>
</html>
