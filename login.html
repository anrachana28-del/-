<!DOCTYPE html>
<html lang="en">
<head>

</head>

<body>

<!-- background -->

<!-- MESSAGE -->
<div id="msg" class="msg"></div>

<!-- LOGIN BOX -->
<div class="box">
    <h2>ប្រព័ន្ធគ្រប់គ្រងភ្ញៀវ</h2>
<div class="input-group">
 <input id="username" placeholder="ឈ្មោះគណនី">

</div>
   

    <button id="loginBtn" style="font-family: khmer os;font-size:16px;">ចូល</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">កំពុងដំណើរការ...</div>
    </div>
</div>
